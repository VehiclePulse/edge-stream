[package]
name = "edge-stream"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
config =  { version = "0.15.27", features = [ "json" ] }
futures-util = "0.3.34"
lapin = "4.12.3"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
reqwest = { version = "0.13.5", features = [ "query", "json" ] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio =  { version = "1.53.2", features = [ "full" ] }
tokio-util = { version = "0.7", features = [ "rt" ] }
uuid = "1.28.0"
vehicle-simulator = { git = "ssh://git@github.com/VehiclePulse/vehicle-simulator.git" }
